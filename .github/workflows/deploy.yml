name: Deploy HDO Trade to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_DOMAIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_imageBB_key: ${{ secrets.NEXT_PUBLIC_IMAGEBB_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BING_VERIFICATION }}
          NEXT_PUBLIC_YANDEX_VERIFICATION: ${{ secrets.NEXT_PUBLIC_YANDEX_VERIFICATION }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        
  # ─────────────────────────────────────────
  # JOB 2 — Deploy to VPS (only if build ok)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_DOMAIN: ${{ secrets.NEXT_PUBLIC_DOMAIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_IMAGEBB_KEY: ${{ secrets.NEXT_PUBLIC_IMAGEBB_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GOOGLE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BING_VERIFICATION }}
          NEXT_PUBLIC_YANDEX_VERIFICATION: ${{ secrets.NEXT_PUBLIC_YANDEX_VERIFICATION }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: MONGODB_URI,NEXTAUTH_URL,NEXTAUTH_SECRET,AUTH_SECRET,AUTH_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_DOMAIN,STRIPE_SECRET_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,RESEND_API_KEY,EMAIL_FROM,NEXT_PUBLIC_IMAGEBB_KEY,NEXT_PUBLIC_GA_ID,NEXT_PUBLIC_GOOGLE_VERIFICATION,NEXT_PUBLIC_BING_VERIFICATION,NEXT_PUBLIC_YANDEX_VERIFICATION
          script: |
            set -e
            APP_DIR=/var/www/comet-commerce
            cd $APP_DIR

            # ── 1. Point git remote to ORIAN repo ──────────────────────
            git remote set-url origin https://github.com/HDOGLOBAL/ORIAN.git

            # ── 2. Pull latest code ─────────────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── 3. Write production .env from GitHub Secrets ────────────
            cat > $APP_DIR/.env << ENVEOF
            MONGODB_URI=$MONGODB_URI
            NEXTAUTH_URL=$NEXTAUTH_URL
            NEXTAUTH_SECRET=$NEXTAUTH_SECRET
            AUTH_SECRET=$AUTH_SECRET
            AUTH_URL=$AUTH_URL
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_DOMAIN=$NEXT_PUBLIC_DOMAIN
            STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            RESEND_API_KEY=$RESEND_API_KEY
            EMAIL_FROM=$EMAIL_FROM
            NEXT_PUBLIC_imageBB_key=$NEXT_PUBLIC_IMAGEBB_KEY
            NEXT_PUBLIC_GA_ID=$NEXT_PUBLIC_GA_ID
            NEXT_PUBLIC_GOOGLE_VERIFICATION=$NEXT_PUBLIC_GOOGLE_VERIFICATION
            NEXT_PUBLIC_BING_VERIFICATION=$NEXT_PUBLIC_BING_VERIFICATION
            NEXT_PUBLIC_YANDEX_VERIFICATION=$NEXT_PUBLIC_YANDEX_VERIFICATION
            ENVEOF

            # ── 4. Install deps & build ─────────────────────────────────
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm ci --prefer-offline
            NODE_ENV=production npm run build

            # ── 5. Install pm2 if missing, then restart ─────────────────
            which pm2 || npm install -g pm2
            pm2 restart hdotrade 2>/dev/null \
              || pm2 start server.js --name hdotrade --env production
            pm2 save

            echo "✅ Deployed to VPS!"
